# Prevent PHP script execution in uploads directories (Anti-Webshell Protection)
location ~* ^/(assets/uploads|uploads)/.*\.php$ {
    deny all;
}

# Block direct access to sensitive directories
location ~ ^/(config|core|models|controllers|logs|storage|data|tests)/ {
    deny all;
}

# Block hidden files (.env, .git, .gitignore, .htaccess, etc.)
location ~ /\.(env|git|gitignore|htaccess) {
    deny all;
}

# Block database dumps, backups and log files
location ~* \.(sqlite|sql|log|bak|swp)$ {
    deny all;
}

# Block sensitive install files (allow install/index.php only during setup)
location = /install/schema.sql { deny all; }
location = /install/install.lock { deny all; }
location = /install/config_defaults.json { deny all; }

# Force public route directories through the router
location /reviews {
    try_files $uri $uri/ /index.php?$query_string;
}

location /blog {
    try_files $uri $uri/ /index.php?$query_string;
}

# Route everything else through index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# FastCGI performance tuning for high-throughput affiliate tracking
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_busy_buffers_size 64k;
fastcgi_temp_file_write_size 64k;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Static asset caching (CSS, JS, images, fonts, icons)
location ~* \.(jpg|jpeg|png|gif|ico|webp|css|js|woff|woff2|ttf|svg|eot)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
    try_files $uri =404;
}

# Real-time tracking routes - prevent intermediate proxy/browser caching
location ~ ^/(click|postback|pixel|smartlink) {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri /index.php?$query_string;
}

