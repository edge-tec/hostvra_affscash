location / {
    # Block direct access to sensitive directories and files
    location ~ ^/(config|core|models|controllers|logs|storage|data)/ {
        deny all;
    }

    # Block sensitive install files (but allow install/index.php for first-time setup)
    location ~ ^/install/(schema\.sql|install\.lock|config_defaults\.json)$ {
        deny all;
    }

    # Force public route directories through the router
    rewrite ^/reviews(/.*)?$ /index.php?$query_string last;
    rewrite ^/blog(/.*)?$ /index.php?$query_string last;

    # Skip real files and directories — serve them directly
    # Route everything else through index.php
    try_files $uri $uri/ /index.php?$query_string;
}

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
