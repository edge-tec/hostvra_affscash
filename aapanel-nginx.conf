# ══════════════════════════════════════════════════════════════════════════════
# Affscash Enterprise Affiliate Tracking — Nginx Configuration
# Place this inside your server {} block in the aaPanel site config
# ══════════════════════════════════════════════════════════════════════════════

# ── Rate Limiting (place in http {} block if not already present) ────────────
# limit_req_zone $binary_remote_addr zone=tracking:10m rate=30r/s;
# limit_conn_zone $binary_remote_addr zone=perip:10m;

# ── Gzip Compression ─────────────────────────────────────────────────────────
gzip on;
gzip_types application/json text/plain text/css application/javascript application/xml text/xml;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;

# ── Prevent PHP script execution in uploads directories (Anti-Webshell) ──────
location ~* ^/(assets/uploads|uploads)/.*\.php$ {
    deny all;
}

# ── Block direct access to sensitive directories ─────────────────────────────
location ~ ^/(config|core|models|controllers|logs|storage|data|tests|cron|scripts)/ {
    deny all;
}

# ── Block hidden files (.env, .git, .gitignore, .htaccess, etc.) ─────────────
location ~ /\.(env|git|gitignore|htaccess) {
    deny all;
}

# ── Block database dumps, backups and log files ──────────────────────────────
location ~* \.(sqlite|sql|log|bak|swp|py|patch)$ {
    deny all;
}

# ── Block sensitive install files (allow install/index.php only during setup) ─
location = /install/schema.sql { deny all; }
location = /install/install.lock { deny all; }
location = /install/config_defaults.json { deny all; }

# ── Force public route directories through the router ─────────────────────────
location /reviews {
    try_files $uri $uri/ /index.php?$query_string;
}

location /blog {
    try_files $uri $uri/ /index.php?$query_string;
}

# ── Route everything else through index.php ───────────────────────────────────
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ── FastCGI performance tuning for high-throughput affiliate tracking ─────────
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_busy_buffers_size 64k;
fastcgi_temp_file_write_size 64k;

# ── Security Headers (Global) ────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://fcm.googleapis.com; frame-src 'self' https://www.google.com https://challenges.cloudflare.com;" always;

# ── Static asset caching (CSS, JS, images, fonts, icons) ─────────────────────
location ~* \.(jpg|jpeg|png|gif|ico|webp|css|js|woff|woff2|ttf|svg|eot)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform" always;
    # Re-include security headers (nginx drops parent add_header in nested blocks)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    access_log off;
    try_files $uri =404;
}

# ── Real-time tracking routes — prevent ALL caching ──────────────────────────
# Covers: /click/{id}, /postback, /pixel, /impression, /smartlink/{slug},
#         /offer/{id} (in-house), /s/{code} (short links), /test-postback-click
location ~ ^/(click|postback|pixel|impression|smartlink|offer|s/|test-postback-click) {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    # Re-include security headers (nginx drops parent add_header in nested blocks)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Uncomment to enable rate limiting:
    # limit_req zone=tracking burst=50 nodelay;
    try_files $uri /index.php?$query_string;
}
