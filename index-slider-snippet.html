<!--
  ════════════════════════════════════════════════════════════════
   AFFSCASH HERO SLIDER LOADER  —  paste this into index.html
   Put the HTML where you want the slider to appear in the page.
   Put the <script> block just before </body>
  ════════════════════════════════════════════════════════════════
-->

<!-- ── STEP 1: Paste this HTML where you want the slider ──────── -->
<section id="hero-slider-section" style="position:relative;overflow:hidden;background:#1a1535">
  <!-- Slides container -->
  <div id="hs-track" style="display:flex;transition:transform .55s cubic-bezier(.77,0,.175,1)">
    <!-- Slides injected by JS -->
    <div style="flex:0 0 100%;min-height:520px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1535,#2d1b69)">
      <div style="text-align:center;color:rgba(255,255,255,.4);font-family:Rajdhani,sans-serif;font-size:16px">
        <div style="font-size:36px;margin-bottom:10px">🔄</div>Loading slider…
      </div>
    </div>
  </div>

  <!-- Dots -->
  <div id="hs-dots" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10"></div>

  <!-- Prev / Next arrows -->
  <button onclick="hsPrev()" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;cursor:pointer;z-index:10;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.25)'" onmouseout="this.style.background='rgba(255,255,255,.12)'">‹</button>
  <button onclick="hsNext()" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:18px;cursor:pointer;z-index:10;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.25)'" onmouseout="this.style.background='rgba(255,255,255,.12)'">›</button>
</section>

<!-- ── STEP 2: Paste this <script> just before </body> ─────────── -->
<script>
(function() {
  // ── CONFIG ── update path if your api is in a subfolder
  var HS_API = 'api/data.php';

  var hsSlides = [], hsIdx = 0, hsTimer = null;

  function badgePill(b) {
    var styles = {
      hot: 'background:linear-gradient(135deg,#ff4500,#e8197a)',
      top: 'background:linear-gradient(135deg,#f59e0b,#ef4444)',
      new: 'background:linear-gradient(135deg,#059669,#0ea5e9)'
    };
    var labels = { hot:'🔥 Hot', top:'⭐ Top', new:'✨ New' };
    return Object.keys(styles).filter(k => b.includes(k))
      .map(k => '<span style="'+styles[k]+';color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.8px;margin-right:4px">'+labels[k]+'</span>').join('');
  }

  function buildSlides() {
    if (!hsSlides.length) return;
    var track = document.getElementById('hs-track');
    var dots  = document.getElementById('hs-dots');
    if (!track || !dots) return;

    track.innerHTML = hsSlides.map(function(s) {
      var bg = s.image ? 'url(' + s.image + ') center/cover no-repeat' : 'linear-gradient(135deg,#1a1535,#2d1b69)';
      var bp = badgePill(s.badges || []);
      return '<div style="flex:0 0 100%;min-height:520px;background:' + bg + ';position:relative;display:flex;align-items:center;justify-content:center">' +
        '<div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.65) 0%,rgba(0,0,0,.3) 60%,transparent)"></div>' +
        '<div style="position:relative;z-index:2;max-width:700px;padding:0 48px;color:#fff">' +
          (bp ? '<div style="margin-bottom:14px">' + bp + '</div>' : '') +
          '<h2 style="font-family:Rajdhani,sans-serif;font-size:clamp(28px,4vw,54px);font-weight:700;margin-bottom:10px;line-height:1.1">' + s.name + '</h2>' +
          (s.desc ? '<p style="font-size:15px;opacity:.82;margin-bottom:22px;max-width:480px">' + s.desc + '</p>' : '') +
          '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">' +
            (s.payout ? '<span style="font-family:Rajdhani,sans-serif;font-size:26px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">' + s.payout + '</span>' : '') +
            (s.geos ? '<span style="font-size:12px;opacity:.7;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px 12px;border-radius:20px">' + s.geos + '</span>' : '') +
            '<a href="' + (s.link || 'https://app.affscash.net/register') + '" target="_blank" style="display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#e8197a,#7c3aed);color:#fff;font-family:Rajdhani,sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:12px 26px;border-radius:9px;text-decoration:none;box-shadow:0 6px 22px rgba(232,25,122,.4)">Apply Now →</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    dots.innerHTML = hsSlides.map(function(_, i) {
      return '<button onclick="hsGo(' + i + ')" style="width:' + (i===0?'20':'7') + 'px;height:7px;border-radius:4px;border:none;background:' + (i===0?'linear-gradient(135deg,#e8197a,#7c3aed)':'rgba(255,255,255,.3)') + ';cursor:pointer;transition:all .3s;padding:0" id="hs-dot-' + i + '"></button>';
    }).join('');

    hsGo(0);
    clearInterval(hsTimer);
    hsTimer = setInterval(function() { hsGo((hsIdx + 1) % hsSlides.length); }, 4000);
  }

  window.hsGo = function(n) {
    hsIdx = n;
    var t = document.getElementById('hs-track');
    if (t) t.style.transform = 'translateX(-' + (n * 100) + '%)';
    hsSlides.forEach(function(_, i) {
      var d = document.getElementById('hs-dot-' + i);
      if (!d) return;
      d.style.width      = i === n ? '20px' : '7px';
      d.style.background = i === n ? 'linear-gradient(135deg,#e8197a,#7c3aed)' : 'rgba(255,255,255,.3)';
    });
  };
  window.hsNext = function() { hsGo((hsIdx + 1) % hsSlides.length); };
  window.hsPrev = function() { hsGo((hsIdx - 1 + hsSlides.length) % hsSlides.length); };

  // Load from API
  fetch(HS_API + '?resource=slider&action=list')
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (json.success && json.data && json.data.length) {
        hsSlides = json.data;
        buildSlides();
      }
    })
    .catch(function(e) { console.warn('Affscash slider load error:', e.message); });
})();
</script>
